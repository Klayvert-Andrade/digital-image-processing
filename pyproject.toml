[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imagelab-pdi"
version = "0.1.0"
description = "Bancada acadêmica de Processamento Digital de Imagens"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=10.4,<12",
  "PySide6>=6.8,<7",
  "scipy>=1.14,<2",
  "typing-extensions>=4.12,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
]

[project.scripts]
imagelab = "imagelab.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/imagelab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"

[tool.coverage.run]
source = ["imagelab"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["imagelab"]
strict = true
warn_unreachable = true
show_error_codes = true
